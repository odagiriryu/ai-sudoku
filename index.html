<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIコーチ付きナンプレ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            background-color: #fdf6e3; 
            color: #4a4a4a;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            min-height: 100vh; margin: 0; padding-top: 15px; touch-action: manipulation; 
        }
        
        #menu-screen, #game-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
        
        h1 { color: #d35400; font-size: 2rem; margin-bottom: 20px; text-align: center; text-shadow: 2px 2px 0px #f39c12; letter-spacing: 2px; }
        
        .section-title { color: #666; font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; text-align: center; border-bottom: 3px dashed #ccc; padding-bottom: 5px; width: 80%; }

        /* キャラクター選択ボタン（余白を消して枠いっぱいに拡大） */
        .coach-selection { display: flex; gap: 15px; margin-bottom: 30px; width: 90%; justify-content: center; }
        .coach-btn { 
            background-color: #fff; border: 4px solid #bdc3c7; border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; 
            transition: all 0.2s; box-shadow: 0 4px 0px #bdc3c7; display: flex; align-items: center; justify-content: center;
            flex: 1; max-width: 100px; height: 100px;
        }
        .coach-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #bdc3c7; }
        .coach-btn.active { border-color: #e74c3c; background-color: #ffeaea; box-shadow: 0 4px 0px #e74c3c; transform: translateY(-2px); }
        .coach-btn img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; transform: scale(1.5); }
        .coach-label { font-size: 1.1rem; color: #4a4a4a; text-align: center; font-weight: bold; margin-top: 8px; }

        .stage-list { display: flex; flex-direction: column; gap: 15px; width: 85%; }
        .stage-btn { 
            background-color: #3498db; color: white; border: 4px solid #2980b9; padding: 15px; 
            font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer; 
            box-shadow: 0 5px 0px #2980b9; text-shadow: 1px 1px 0px #222; transition: all 0.1s; letter-spacing: 1px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .stage-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #2980b9; }
        .stage-btn.test-btn { background-color: #f39c12; border-color: #d35400; box-shadow: 0 5px 0px #d35400; }
        .stage-btn.test-btn:active { box-shadow: 0 0px 0px #d35400; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; width: 90%; margin-bottom: 15px; background-color: #fff; padding: 10px 15px; border-radius: 10px; border: 3px solid #ccc; box-sizing: border-box; box-shadow: 0 4px 0px rgba(0,0,0,0.05); }
        #stage-title { color: #d35400; font-size: 1.3rem; font-weight: bold; margin: 0; }
        #timer { font-size: 1.4rem; font-weight: bold; color: #34495e; letter-spacing: 2px; }

        /* コーチエリア */
        .ai-character-area { 
            width: 90%; height: 120px; background-color: #fff; border-radius: 15px; 
            display: flex; align-items: flex-end; justify-content: center; margin-bottom: 20px; 
            border: 4px solid #7f8c8d; box-shadow: 0 6px 0px #7f8c8d; 
            transition: all 0.3s ease; overflow: hidden; position: relative;
        }
        .ai-character-area::before {
            content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 2px dashed #d5dbdb; border-radius: 10px; pointer-events: none;
        }
        .ai-character-area.thinking { background-color: #fff8e1; border-color: #f39c12; box-shadow: 0 6px 0px #f39c12; }
        .ai-character-area.thinking::before { border-color: #fdebd0; }
        .ai-character-area.happy { background-color: #e8f5e9; border-color: #27ae60; box-shadow: 0 6px 0px #27ae60; }
        .ai-character-area.happy::before { border-color: #d5f5e3; }
        
        /* プレイ画面のコーチ画像：はみ出さないように元の設定に戻しました */
        #coach-image { max-height: 100%; width: auto; image-rendering: pixelated; object-fit: contain; z-index: 1; }

        .sudoku-container { 
            background-color: #ecf0f1; padding: 8px; border-radius: 12px; 
            box-shadow: 0 6px 0px #bdc3c7; border: 4px solid #7f8c8d; margin-bottom: 25px; 
        }
        table { border-collapse: collapse; border: 4px solid #2c3e50; table-layout: fixed; background-color: #fff; margin: 0 auto; }
        td { 
            border: 1px solid #bdc3c7; width: 42px; height: 42px; max-width: 42px; max-height: 42px; 
            box-sizing: border-box; text-align: center; vertical-align: middle; 
            font-size: 1.8rem; font-weight: bold; color: #2c3e50; cursor: pointer; padding: 0; 
            user-select: none; line-height: 1; transition: background-color 0.1s; 
        }

        td.fixed { color: #2980b9; background-color: #ebf5fb; cursor: default; }
        td.selected { background-color: #fff3e0; border: 3px solid #e67e22; font-size: 2rem; color: #d35400; z-index: 10; position: relative; }
        td.error { color: #e74c3c; background-color: #fdedec; font-weight: 900; animation: shake 0.3s; }
        @keyframes shake { 0% {transform: translateX(0);} 25% {transform: translateX(-3px);} 50% {transform: translateX(3px);} 75% {transform: translateX(-3px);} 100% {transform: translateX(0);} }
        td.highlight { background-color: #f1c40f !important; border: 3px solid #f39c12 !important; position: relative; z-index: 5; }

        td:nth-child(3n) { border-right: 3px solid #2c3e50; }
        tr:nth-child(3n) td { border-bottom: 3px solid #2c3e50; }
        td:last-child { border-right: 4px solid #2c3e50; }
        tr:last-child td { border-bottom: 4px solid #2c3e50; }
        td:first-child { border-left: 4px solid #2c3e50; }
        tr:first-child td { border-top: 4px solid #2c3e50; }

        .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 95%; margin-bottom: 20px; }
        .num-btn { 
            background-color: #fdfefe; border: 3px solid #95a5a6; padding: 12px 0; 
            font-size: 1.6rem; font-weight: bold; border-radius: 10px; color: #2c3e50; 
            cursor: pointer; box-shadow: 0 5px 0px #95a5a6; transition: all 0.1s; 
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .num-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #95a5a6; }
        .num-btn.delete-btn { 
            grid-column: span 5; background-color: #e74c3c; color: white; 
            border-color: #c0392b; box-shadow: 0 5px 0px #c0392b; font-size: 1.3rem; 
            text-shadow: 1px 1px 0px #222; letter-spacing: 1px;
        }
        .num-btn.delete-btn:active { box-shadow: 0 0px 0px #c0392b; }

        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 95%; margin-bottom: 30px; }
        #hint-area { 
            background-color: #fef9e7; border: 4px solid #f1c40f; padding: 15px; border-radius: 12px; 
            width: 100%; box-sizing: border-box; color: #333; font-size: 1.1rem; line-height: 1.5; 
            display: none; font-weight: bold; text-align: center; box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }
        #loading { display: none; color: #e67e22; font-weight: bold; font-size: 1.1rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        #hint-btn { 
            background-color: #f1c40f; color: #d35400; border: 4px solid #f39c12; padding: 15px; 
            font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; 
            box-shadow: 0 5px 0px #f39c12; width: 100%; transition: all 0.1s; letter-spacing: 1px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        #hint-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #f39c12; }
        #hint-btn:disabled { background-color: #ecf0f1; border-color: #bdc3c7; color: #95a5a6; box-shadow: 0 5px 0px #bdc3c7; cursor: not-allowed; }
        #hint-btn.upsell-mode { background-color: #ff9800; color: white; border-color: #e65100; box-shadow: 0 5px 0px #e65100; text-shadow: 1px 1px 0px #222; }
        
        .back-btn { 
            background-color: #95a5a6; color: white; border: 4px solid #7f8c8d; padding: 12px; 
            font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; 
            width: 80%; box-shadow: 0 4px 0px #7f8c8d; transition: all 0.1s;
            font-family: 'M PLUS Rounded 1c', sans-serif; text-decoration: none; display: block; text-align: center; box-sizing: border-box;
        }
        .back-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #7f8c8d; }

        #clear-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { 
            background-color: #fff; padding: 30px; border-radius: 20px; text-align: center; 
            width: 85%; max-width: 320px; border: 6px solid #f1c40f; box-shadow: 0 10px 0px #f39c12; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .modal-title { font-size: 2.2rem; color: #e74c3c; margin-top: 0; margin-bottom: 15px; font-weight: bold; text-shadow: 2px 2px 0px #f1c40f; }
        .modal-time { font-size: 1.4rem; color: #2c3e50; margin-bottom: 25px; font-weight: bold; }
        .modal-btn { 
            background-color: #2ecc71; color: white; border: 4px solid #27ae60; padding: 15px 24px; 
            font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; 
            box-shadow: 0 5px 0px #27ae60; text-shadow: 1px 1px 0px #222; transition: all 0.1s;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .modal-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #27ae60; }
    </style>
</head>
<body>

    <!-- メニュー画面 -->
    <div id="menu-screen">
        <h1>AIコーチ付きナンプレ</h1>
        
        <div class="section-title">相棒（コーチ）を選んでください</div>
        <div class="coach-selection">
            <div>
                <button class="coach-btn" id="coach-male" onclick="selectCoach('male')">
                    <img src="images/coach_male_normal.png" alt="マコト">
                </button>
                <div class="coach-label">マコト</div>
            </div>
            <div>
                <button class="coach-btn active" id="coach-robot" onclick="selectCoach('robot')">
                    <img src="images/coach_robot_normal.png" alt="ロボ助">
                </button>
                <div class="coach-label">ロボ助</div>
            </div>
            <div>
                <button class="coach-btn" id="coach-female" onclick="selectCoach('female')">
                    <img src="images/coach_female_normal.png" alt="サクラ">
                </button>
                <div class="coach-label">サクラ</div>
            </div>
        </div>

        <div class="section-title">遊ぶステージを選んでください</div>
        <div class="stage-list"></div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" style="display: none;">
        <div class="header-area">
            <div id="stage-title"></div>
            <div id="timer">00:00</div>
        </div>

        <div id="ai-character" class="ai-character-area">
            <img id="coach-image" src="images/coach_robot_normal.png" alt="コーチ">
        </div>

        <div class="sudoku-container">
            <table id="sudoku-board"></table>
        </div>

        <div class="numpad">
            <button class="num-btn" onclick="inputNumber(1)">1</button>
            <button class="num-btn" onclick="inputNumber(2)">2</button>
            <button class="num-btn" onclick="inputNumber(3)">3</button>
            <button class="num-btn" onclick="inputNumber(4)">4</button>
            <button class="num-btn" onclick="inputNumber(5)">5</button>
            <button class="num-btn" onclick="inputNumber(6)">6</button>
            <button class="num-btn" onclick="inputNumber(7)">7</button>
            <button class="num-btn" onclick="inputNumber(8)">8</button>
            <button class="num-btn" onclick="inputNumber(9)">9</button>
            <button class="num-btn delete-btn" onclick="inputNumber(0)">マスを空にする</button>
        </div>

        <div class="controls">
            <div id="loading">AIコーチが思考中...（約6秒）</div>
            <div id="hint-area"></div>
            <button id="hint-btn">AIにヒントを聞く (残り3回)</button>
            <button class="back-btn" onclick="backToMenu()">メニューに戻る</button>
        </div>
    </div>

    <div id="clear-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">🎉 クリア！ 🎉</div>
            <div class="modal-time">タイム: <span id="final-time">00:00</span></div>
            <button class="modal-btn" onclick="closeClearModal()">メニューへ戻る</button>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzyvzJeCKPbw8Y2Phz5hAcKWovpk3JiPVu-_Ij4noKMCv7z7md-31o2tROvd0MVmTYjGg/exec";
        const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/test_00wfZj6KO1KXaWWdkRfMA00";

        const coachImages = {
            male: {
                normal: 'images/coach_male_normal.png',
                thinking: 'images/coach_male_thinking.png',
                happy_a: 'images/coach_male_happy_a.png',
                happy_b: 'images/coach_male_happy_b.png'
            },
            female: {
                normal: 'images/coach_female_normal.png',
                thinking: 'images/coach_female_thinking.png',
                happy_a: 'images/coach_female_happy_a.png',
                happy_b: 'images/coach_female_happy_b.png'
            },
            robot: {
                normal: 'images/coach_robot_normal.png',
                thinking: 'images/coach_robot_thinking.png',
                happy_a: 'images/coach_robot_happy_a.png',
                happy_b: 'images/coach_robot_happy_b.png'
            }
        };
        
        let currentCoach = 'robot'; 
        let happyAnimationInterval = null;

        const stagesData = [
            { title: "テスト用 (あと1マス)", board: [[5, 3, 4, 6, 7, 8, 9, 1, 2], [6, 7, 2, 1, 9, 5, 3, 4, 8], [1, 9, 8, 3, 4, 2, 5, 6, 7], [8, 5, 9, 7, 6, 1, 4, 2, 3], [4, 2, 6, 8, 5, 3, 7, 9, 1], [7, 1, 3, 9, 2, 4, 8, 5, 6], [9, 6, 1, 5, 3, 7, 2, 8, 4], [2, 8, 7, 4, 1, 9, 6, 3, 5], [3, 4, 5, 2, 8, 6, 1, 7, 0]] },
            { title: "初級 1", board: [[7, 9, 0, 3, 0, 1, 6, 8, 4], [4, 2, 0, 5, 8, 0, 0, 7, 0], [0, 3, 8, 0, 4, 7, 9, 2, 5], [2, 0, 0, 1, 5, 0, 0, 0, 7], [9, 7, 0, 2, 3, 0, 8, 5, 6], [0, 0, 0, 9, 7, 0, 4, 1, 0], [8, 0, 2, 7, 9, 0, 5, 6, 0], [0, 6, 9, 0, 0, 2, 7, 3, 0], [3, 1, 0, 8, 0, 0, 2, 4, 9]] },
            { title: "初級 2", board: [[1, 3, 4, 0, 5, 2, 0, 8, 0], [0, 8, 2, 0, 1, 0, 0, 3, 7], [5, 0, 9, 0, 0, 3, 2, 4, 0], [7, 1, 5, 0, 0, 4, 0, 0, 0], [0, 6, 0, 3, 0, 1, 0, 7, 0], [2, 4, 3, 8, 7, 5, 9, 1, 0], [4, 9, 1, 2, 3, 0, 7, 5, 8], [3, 2, 7, 5, 9, 0, 1, 0, 0], [0, 5, 0, 1, 0, 7, 0, 9, 2]] },
            { title: "初級 3", board: [[8, 1, 7, 0, 3, 0, 9, 0, 0], [0, 4, 5, 0, 8, 7, 2, 3, 0], [6, 3, 2, 9, 5, 4, 0, 1, 0], [4, 8, 3, 5, 0, 0, 0, 7, 0], [0, 9, 6, 3, 0, 1, 4, 8, 0], [2, 7, 1, 8, 0, 9, 0, 6, 0], [0, 6, 9, 0, 2, 8, 0, 0, 3], [7, 5, 8, 4, 9, 0, 6, 0, 1], [3, 0, 4, 0, 1, 0, 8, 0, 0]] },
            { title: "初級 4", board: [[0, 8, 7, 5, 1, 0, 2, 0, 3], [9, 3, 1, 8, 7, 0, 6, 0, 0], [4, 0, 2, 0, 0, 0, 0, 8, 0], [2, 4, 0, 0, 0, 3, 0, 0, 6], [7, 1, 0, 2, 5, 6, 9, 0, 4], [5, 6, 3, 4, 0, 1, 8, 0, 0], [8, 0, 4, 1, 6, 5, 3, 2, 0], [3, 2, 0, 9, 0, 7, 0, 1, 8], [1, 7, 0, 0, 2, 8, 4, 6, 0]] },
            { title: "初級 5", board: [[5, 0, 1, 4, 3, 6, 8, 0, 0], [4, 8, 0, 0, 7, 0, 0, 1, 5], [0, 7, 0, 5, 8, 0, 6, 2, 4], [2, 0, 5, 8, 6, 0, 0, 0, 3], [8, 6, 3, 0, 0, 2, 4, 0, 7], [1, 9, 7, 0, 4, 5, 2, 0, 0], [6, 1, 4, 7, 5, 8, 9, 0, 0], [0, 0, 2, 9, 1, 0, 5, 6, 8], [9, 0, 0, 0, 0, 3, 7, 4, 0]] }
        ];

        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const table = document.getElementById('sudoku-board');
        const hintBtn = document.getElementById('hint-btn');
        const hintArea = document.getElementById('hint-area');
        const loadingDisplay = document.getElementById('loading');
        const timerDisplay = document.getElementById('timer');
        const stageTitle = document.getElementById('stage-title');
        const aiCharacterArea = document.getElementById('ai-character');
        const coachImage = document.getElementById('coach-image');
        const clearModal = document.getElementById('clear-modal');

        let currentOriginalBoard = [];
        let currentBoardData = [];
        let selectedCell = null; 
        
        let hintsRemaining = 3; 
        let startTime; 
        let timerInterval; 
        let isCleared = false; 
        let isUnlimitedHints = false; 

        function initMenu() {
            const stageListDiv = document.querySelector('.stage-list');
            stageListDiv.innerHTML = ""; 
            
            stagesData.forEach((stage, index) => {
                const btn = document.createElement('button');
                btn.className = index === 0 ? 'stage-btn test-btn' : 'stage-btn';
                btn.innerText = stage.title;
                btn.onclick = () => startStage(index);
                stageListDiv.appendChild(btn);
            });
        }

        function selectCoach(coachType) {
            currentCoach = coachType;
            document.querySelectorAll('.coach-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`coach-${coachType}`).classList.add('active');
            coachImage.src = coachImages[currentCoach].normal;
        }

        function startHappyAnimation() {
            stopHappyAnimation();
            let stateA = true;
            coachImage.src = coachImages[currentCoach].happy_a; 
            happyAnimationInterval = setInterval(() => {
                stateA = !stateA;
                coachImage.src = stateA ? coachImages[currentCoach].happy_a : coachImages[currentCoach].happy_b;
            }, 500); 
        }

        function stopHappyAnimation() {
            if (happyAnimationInterval) {
                clearInterval(happyAnimationInterval);
                happyAnimationInterval = null;
            }
        }

        function setCoachState(state) {
            stopHappyAnimation(); 
            
            if (state === 'happy') {
                startHappyAnimation(); 
            } else {
                coachImage.src = coachImages[currentCoach][state]; 
            }
            aiCharacterArea.className = 'ai-character-area ' + state;
        }

        function startStage(stageIndex) {
            const stage = stagesData[stageIndex];
            currentOriginalBoard = JSON.parse(JSON.stringify(stage.board));
            currentBoardData = JSON.parse(JSON.stringify(stage.board));
            stageTitle.innerText = stage.title;

            hintsRemaining = 3;
            isCleared = false;
            isUnlimitedHints = false; 
            selectedCell = null;
            
            hintBtn.disabled = false;
            hintBtn.classList.remove('upsell-mode');
            hintBtn.innerText = `AIにヒントを聞く (残り${hintsRemaining}回)`;
            hintArea.style.display = 'none';
            clearModal.style.display = 'none';

            setCoachState('normal');
            createBoardUI();
            startTimer();

            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
        }

        function backToMenu() {
            stopTimer();
            stopHappyAnimation(); 
            gameScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        }

        function startTimer() {
            stopTimer(); 
            timerDisplay.innerText = "00:00";
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
                const seconds = (elapsedSeconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${minutes}:${seconds}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function createBoardUI() {
            table.innerHTML = ""; 
            for (let r = 0; r < 9; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    const td = document.createElement('td');
                    td.id = `cell-${r}-${c}`;
                    if (currentBoardData[r][c] !== 0) {
                        td.innerText = currentBoardData[r][c];
                        td.classList.add('fixed');
                    } else {
                        td.innerText = "";
                        td.addEventListener('click', () => selectCell(r, c));
                    }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
        }

        function selectCell(r, c) {
            if (isCleared || currentOriginalBoard[r][c] !== 0) return; 
            document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
            clearHighlights();
            selectedCell = { r, c };
            document.getElementById(`cell-${r}-${c}`).classList.add('selected');
        }

        function inputNumber(num) {
            if (isCleared || !selectedCell) return;
            const r = selectedCell.r;
            const c = selectedCell.c;
            currentBoardData[r][c] = num;
            document.getElementById(`cell-${r}-${c}`).innerText = num === 0 ? '' : num;
            checkBoardErrors();
            checkClear();
        }

        function checkBoardErrors() {
            document.querySelectorAll('.cell, td').forEach(cell => cell.classList.remove('error'));
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const val = currentBoardData[r][c];
                    if (val === 0) continue;
                    let isError = false;
                    for (let i = 0; i < 9; i++) {
                        if (i !== c && currentBoardData[r][i] === val) isError = true;
                        if (i !== r && currentBoardData[i][c] === val) isError = true;
                    }
                    const br = Math.floor(r / 3) * 3;
                    const bc = Math.floor(c / 3) * 3;
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            if ((br + i !== r || bc + j !== c) && currentBoardData[br + i][bc + j] === val) {
                                isError = true;
                            }
                        }
                    }
                    if (isError) {
                        document.getElementById(`cell-${r}-${c}`).classList.add('error');
                    }
                }
            }
        }

        function checkClear() {
            let isFull = true;
            let hasError = document.querySelectorAll('.error').length > 0;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (currentBoardData[r][c] === 0) isFull = false;
                }
            }

            if (isFull && !hasError && !isCleared) {
                isCleared = true; 
                stopTimer(); 
                document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
                selectedCell = null;
                
                setCoachState('happy');

                setTimeout(() => {
                    document.getElementById('final-time').innerText = timerDisplay.innerText;
                    clearModal.style.display = 'flex';
                }, 1000); 
            }
        }

        function closeClearModal() {
            clearModal.style.display = 'none';
            backToMenu();
        }

        async function getHint() {
            if (hintsRemaining <= 0 && !isUnlimitedHints) {
                const wantsToBuy = confirm("1ステージの無料ヒント枠（3回）を使い切りました。\n\n「AIヒント使い放題パック（100円）」を購入して、このステージの続きをAIと一緒に解きますか？\n\n※「OK」を押すとStripeの決済画面（テスト用）が開きます。");
                
                if (wantsToBuy) {
                    window.open(STRIPE_PAYMENT_LINK, '_blank');
                    
                    setTimeout(() => {
                        const isPaid = confirm("【プロトタイプ用テスト】\n別タブでの決済は完了しましたか？\n（※「OK」を押すと使い放題が解放されます）");
                        if (isPaid) {
                            isUnlimitedHints = true;
                            hintBtn.classList.remove('upsell-mode');
                            hintBtn.innerText = "AIにヒントを聞く (使い放題✨)";
                            alert("ありがとうございます！ヒントが使い放題になりました！");
                        }
                    }, 1000); 
                    
                    return; 
                } else {
                    return;
                }
            }

            hintBtn.disabled = true;
            hintBtn.innerText = "思考中...";
            loadingDisplay.style.display = 'block';
            hintArea.style.display = 'none';
            hintArea.innerText = "";
            clearHighlights();
            
            setCoachState('thinking');

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(currentBoardData)
                });
                if (!response.ok) throw new Error('通信エラーが発生しました。');
                const result = await response.json();
                
                if (result.success && result.hint) {
                    if (!isUnlimitedHints) {
                        hintsRemaining--;
                    }
                    displayHint(result.hint);
                } else {
                    hintArea.innerText = `ヒントを取得できませんでした: ${result.error?.message || '不明なエラー'}`;
                    hintArea.style.display = 'block';
                }
            } catch (error) {
                hintArea.innerText = `エラーが発生しました: ${error.message}`;
                hintArea.style.display = 'block';
            } finally {
                loadingDisplay.style.display = 'none';
                hintBtn.disabled = false;
                setCoachState('normal');
                
                if (isUnlimitedHints) {
                    hintBtn.innerText = "AIにヒントを聞く (使い放題✨)";
                } else if (hintsRemaining > 0) {
                    hintBtn.innerText = `AIにヒントを聞く (残り${hintsRemaining}回)`;
                } else {
                    hintBtn.innerText = "💎 ヒント使い放題を解放する";
                    hintBtn.classList.add('upsell-mode');
                }
            }
        }

        function displayHint(hint) {
            const r = parseInt(hint.target_row) - 1;
            const c = parseInt(hint.target_col) - 1;
            hintArea.innerText = `コーチのヒント：\n(${r+1}行, ${c+1}列) に「${hint.answer_number}」が入ります。\n理由: ${hint.explanation}`;
            hintArea.style.display = 'block';
            const targetCell = document.getElementById(`cell-${r}-${c}`);
            targetCell.classList.add('highlight');
            selectCell(r, c);
        }

        function clearHighlights() {
            document.querySelectorAll('.highlight').forEach(cell => cell.classList.remove('highlight'));
        }

        hintBtn.addEventListener('click', getHint);

        window.onload = initMenu;

    </script>
</body>
</html>
